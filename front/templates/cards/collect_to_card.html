{% extends "base.html" %}
{% block title %}Собрать средства категории{% endblock %}
{% block content %}
    <h1>📥 Собрать деньги категории на одну карту</h1>
    <form method="POST">
        <div class="form-group">
            <label>Категория</label>
            <select name="category_id" required>
                <option value="">— Выберите —</option>
                {% for cat in categories %}
                    <option value="{{ cat.category_id }}" {% if preselected_category_id == cat.category_id %}selected{% endif %}>
                        {{ cat.category_name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Целевая карта</label>
            <select name="card_id" required>
                <option value="">— Выберите —</option>
                {% for card in cards %}
                    <option value="{{ card.card_id }}">{{ card.card_name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit">Собрать средства</button>
        <a href="{{ url_for('categories.list_categories') }}" class="cancel-link">← Отмена</a>
    </form>
{% endblock %}
