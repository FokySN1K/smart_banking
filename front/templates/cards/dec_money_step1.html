{% extends "base.html" %}

{% block title %}Списать средства — Шаг 1{% endblock %}

{% block content %}
    <h1>📤 Списать средства</h1>
    <p class="context-hint">Выберите карту, с которой хотите списать деньги.</p>

    <div class="card-list">
        {% for card in cards %}
            <div class="card-item">
                <div class="item-title">{{ card[2] }}</div>
                <div class="item-desc">{{ card[5] or '—' }}</div>
                <a href="{{ url_for('cards.dec_money_step2', card_id=card.card_id) }}" class="btn-secondary">Выбрать</a>
            </div>
        {% endfor %}
    </div>

    <a href="{{ url_for('cards.list_cards') }}" class="cancel-link">← Отмена</a>
{% endblock %}
