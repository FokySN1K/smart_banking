{% extends "base.html" %}
{% block title %}Перевод средств из категории{% endblock %}
{% block content %}
    <div class="page-header">
        <h1>🔄 Перевод из «{{ category.category_name }}»</h1>
        <a href="{{ url_for('categories.list_categories') }}"><button>← Назад</button></a>
    </div>

    <form method="POST" id="transfer-form">
        <div class="form-group">
            <label>
                Перевести в другую категорию
            </label>
            <select name="target_category_id" id="target_category" required>
                <option value="none">— Выберите —</option>
                {% for c in other_categories %}
                    <option value="{{ c[0] }}">{{ c[2] }}</option>
                {% endfor %}
                <option value="new">— Новая —</option>
            </select>
        </div>

        <div class="form-group">
           
            <div id="new-category-fields" style="display: none; margin-top: 10px;">
                <input type="text" name="new_category_name" placeholder="Название новой категории" maxlength="100">
                <input type="text" name="new_category_description" placeholder="Описание (опционально)" maxlength="255" style="margin-top: 6px;">
            </div>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" name="delete_old" value="on">
                Закрыть исходную категорию после перевода
            </label>
        </div>

        <button type="submit">Выполнить перевод</button>
    </form>

    <script>
        const select = document.getElementById('target_category');
        const newFields = document.getElementById('new-category-fields');
    
        select.addEventListener('change', function() {
            if (this.value === 'new') {  // ✅ сравнение, а не присваивание
                newFields.style.display = 'block';
            } else {
                newFields.style.display = 'none';
            }
        });
    </script>
{% endblock %}
