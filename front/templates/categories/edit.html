{% extends "base.html" %}

{% block title %}Редактировать категорию{% endblock %}

{% block content %}
    <div class="page-header">
        <h1>✏️ Редактировать категорию</h1>
        <a href="{{ url_for('categories.list_categories') }}"><button>← Назад к категориям</button></a>
    </div>

    <form method="POST">
        <div class="form-group">
            <label>Название категории</label>
            <input type="text" name="category_name" value="{{ category[2] }}" maxlength="100" required>
        </div>

        <div class="form-group">
            <label>Описание</label>
            <input type="text" name="description" value="{{ category[5] or '' }}" maxlength="255">
        </div>

        <button type="submit">Сохранить изменения</button>
    </form>
{% endblock %}
