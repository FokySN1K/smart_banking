{% extends "base.html" %}

{% block content %}
    <div class="hero">
        <h1>🏦 Smart Banking</h1>
        <p class="hero-desc">Интеллектуальное управление личными финансами через карты, категории и шаблоны распределения.</p>
        {% if current_user.is_authenticated %}
            <a href="{{ url_for('cards.list_cards') }}"><button>→ Перейти к картам</button></a>
        {% else %}
            <div class="hero-actions">
                <a href="{{ url_for('auth.login') }}"><button>🔑 Вход</button></a>
                <a href="{{ url_for('auth.register') }}"><button>📝 Регистрация</button></a>
            </div>
        {% endif %}
    </div>
{% endblock %}
